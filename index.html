<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <nav class="bg-gray-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <h1 class="text-xl font-bold">Personal Expense Tracker</h1>
        </div>
    </nav>

    <div id="alert-box" class="fixed top-5 right-5 z-50 hidden max-w-sm w-full bg-white border border-gray-200 rounded-xl shadow-lg p-4 flex items-center justify-between transition-all duration-300">
        <div id="alert-message" class="text-sm font-medium text-gray-900"></div>
        <button id="alert-close" class="text-gray-400 hover:text-gray-600 ml-4 font-bold">&times;</button>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="mb-8">
            <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
                <h2 class="text-2xl font-bold mb-1">Financial Dashboard</h2>
                <p class="text-gray-500 text-sm">Manage your income and expenses in one place.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                    <p class="text-sm font-medium text-gray-500">Total Income</p>
                    <p id="total-income" class="text-2xl font-bold text-gray-900 mt-2">LKR 0.00</p>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                    <p class="text-sm font-medium text-gray-500">Total Expenses</p>
                    <p id="total-expenses" class="text-2xl font-bold text-gray-900 mt-2">LKR 0.00</p>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                    <p class="text-sm font-medium text-gray-500">Current Balance</p>
                    <p id="current-balance" class="text-2xl font-bold text-gray-900 mt-2">LKR 0.00</p>
                </div>
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-sm p-6 mb-8 border border-gray-100">
            <h3 class="text-lg font-bold mb-4">Add a Transaction</h3>
            <form id="transaction-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Transaction Type</label>
                    <select id="type" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <input type="text" id="description" placeholder="e.g. Monthly allowance" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (LKR)</label>
                    <input type="number" id="amount" step="0.01" min="0.01" placeholder="Enter amount" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select id="category" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Allowance">Allowance</option>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Transaction Date</label>
                    <input type="date" id="date" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="flex items-end gap-3 md:col-span-2">
                    <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">Add Transaction</button>
                    <button type="button" id="clear-btn" class="border border-gray-300 text-gray-700 px-5 py-2.5 rounded-lg font-medium hover:bg-gray-50 transition">Clear Form</button>
                </div>
            </form>
        </section>

        <section class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <h3 class="text-lg font-bold mb-4">Transaction History</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Type</label>
                    <select id="filter-type" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expense Only</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Search Transactions</label>
                    <input type="text" id="search" placeholder="Search by description or category" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-600 text-sm">
                            <th class="py-3 px-4 font-semibold">Date</th>
                            <th class="py-3 px-4 font-semibold">Description</th>
                            <th class="py-3 px-4 font-semibold">Type</th>
                            <th class="py-3 px-4 font-semibold">Category</th>
                            <th class="py-3 px-4 font-semibold">Amount (LKR)</th>
                            <th class="py-3 px-4 font-semibold">Action</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-table-body">
                    </tbody>
                </table>
                <div id="no-transactions" class="text-center py-8 text-gray-500 text-sm">No transactions found.</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
